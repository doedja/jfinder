{{define "finder_started"}}
<div class="run">
  <div id="finder-progress" class="progress-card">
    <div class="progress-meta">
      <span class="badge pending">starting</span>
      <span class="muted">Connecting to task stream&hellip;</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span style="width:0%"></span></div>
  </div>
  <div id="finder-final"></div>
</div>
<script>
(function(){
  var taskId = "{{.TaskID}}";
  var src = new EventSource("/api/progress/" + taskId);
  var prog = document.getElementById("finder-progress");
  var final = document.getElementById("finder-final");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function statusLabel(s){
    return ({
      pending:    "queued",
      processing: "working",
      complete:   "complete",
      error:      "error"
    })[s] || s;
  }

  function renderProgress(d){
    var pct = Math.max(0, Math.min(100, d.progress|0));
    var msg = d.message || "";
    return ''
      + '<div class="progress-meta">'
      +   '<span class="badge ' + esc(d.status) + '">' + esc(statusLabel(d.status)) + '</span>'
      +   '<span class="muted">' + esc(msg) + '</span>'
      + '</div>'
      + '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>'
      + '<dl class="stats">'
      +   '<div><dt>Papers found</dt><dd>' + (d.papersFound|0) + ' / ' + (d.totalPapers|0) + '</dd></div>'
      +   '<div><dt>Downloaded</dt><dd>' + (d.papersDownloaded|0) + '</dd></div>'
      +   '<div><dt>Cycle</dt><dd>' + (d.currentCycle|0) + ' / ' + (d.totalCycles|0) + '</dd></div>'
      + '</dl>';
  }

  function renderDone(d){
    var links = '';
    if (d.downloadUrl) links += '<a class="btn primary" href="' + esc(d.downloadUrl) + '">Download ZIP</a> ';
    if (d.metadataUrl) links += '<a class="btn ghost" href="' + esc(d.metadataUrl) + '">Metadata (.txt)</a>';
    var inner = ''
      + '<div class="done">'
      +   '<p class="muted">Task complete.</p>'
      +   '<div class="actions">' + links + '</div>'
      + '</div>';
    final.innerHTML = inner;
  }

  function renderError(d){
    var msg = d.error || d.message || "Task failed.";
    final.innerHTML = ''
      + '<div class="error-card">'
      +   '<p class="tag pale-red">Error</p>'
      +   '<p>' + esc(msg) + '</p>'
      + '</div>';
  }

  var done = false;
  src.onmessage = function(e){
    try {
      var d = JSON.parse(e.data);
      if (d.error && !d.status) { done = true; src.close(); renderError(d); return; }
      prog.innerHTML = renderProgress(d);
      if (d.status === 'complete') { done = true; src.close(); renderDone(d); }
      else if (d.status === 'error') { done = true; src.close(); renderError(d); }
    } catch(err) { console.error('progress parse error', err); }
  };
  // Only stop on a terminal state. A transient drop (proxy/network blip) should
  // let EventSource auto-reconnect and resume polling, not freeze the UI.
  src.onerror = function(){ if (done) src.close(); };
})();
</script>
{{end}}

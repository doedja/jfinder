{{define "gap_started"}}
<div class="run">
  <div id="gap-progress" class="progress-card">
    <div class="progress-meta">
      <span class="badge pending">starting</span>
      <span class="muted">Connecting to analysis stream&hellip;</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span style="width:0%"></span></div>
  </div>
  <div id="gap-final"></div>
</div>
<script>
(function(){
  var taskId = "{{.TaskID}}";
  var src = new EventSource("/api/gap-progress/" + taskId);
  var prog = document.getElementById("gap-progress");
  var final = document.getElementById("gap-final");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  function statusLabel(s){
    return ({
      pending:    "queued",
      searching:  "searching",
      collecting: "collecting",
      analyzing:  "analyzing",
      comparing:  "comparing",
      generating: "generating",
      complete:   "complete",
      error:      "error"
    })[s] || s;
  }

  function statusClass(s){
    if (s === 'complete') return 'complete';
    if (s === 'error')    return 'error';
    if (s === 'pending')  return 'pending';
    return 'processing';
  }

  function renderProgress(d){
    var pct = Math.max(0, Math.min(100, d.progress|0));
    return ''
      + '<div class="progress-meta">'
      +   '<span class="badge ' + statusClass(d.status) + '">' + esc(statusLabel(d.status)) + '</span>'
      +   '<span class="muted">' + esc(d.stage || '') + '</span>'
      + '</div>'
      + '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>'
      + '<dl class="stats">'
      +   '<div><dt>Papers</dt><dd>' + (d.papersFound|0) + '</dd></div>'
      +   '<div><dt>Gaps</dt><dd>' + (d.gapsIdentified|0) + '</dd></div>'
      +   '<div><dt>Comparisons</dt><dd>' + (d.comparisonsComplete|0) + '</dd></div>'
      +   '<div><dt>Directions</dt><dd>' + (d.directionsGenerated|0) + '</dd></div>'
      + '</dl>';
  }

  function renderError(d){
    var msg = d.error || d.stage || "Analysis failed.";
    final.innerHTML = ''
      + '<div class="error-card">'
      +   '<p class="tag pale-red">Error</p>'
      +   '<p>' + esc(msg) + '</p>'
      + '</div>';
  }

  function loadResults(){
    fetch('/api/gap-results/' + taskId)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(res){ if (res) final.innerHTML = renderResult(res); })
      .catch(function(){});
  }

  function renderResult(res){
    var gaps = (res.gaps||[]).slice(0, 8).map(function(g){
      return '<li class="card">'
        + '<p class="tag pale">' + esc(g.severity) + ' / ' + esc(g.type) + '</p>'
        + '<h3>' + esc(g.title) + '</h3>'
        + '<p>' + esc(g.description) + '</p>'
        + (g.suggestedApproach ? '<p class="muted"><strong>Approach.</strong> ' + esc(g.suggestedApproach) + '</p>' : '')
        + '</li>';
    }).join('');
    var dirs = (res.directions||[]).slice(0, 6).map(function(d){
      return '<li class="card">'
        + '<p class="tag pale">novelty ' + esc(d.novelty) + ' / feasibility ' + esc(d.feasibility) + '</p>'
        + '<h3>' + esc(d.title) + '</h3>'
        + '<p>' + esc(d.description) + '</p>'
        + (d.rationale ? '<p class="muted">' + esc(d.rationale) + '</p>' : '')
        + '</li>';
    }).join('');
    var cmps = (res.comparisons||[]).slice(0, 5).map(function(c){
      var findings = (c.findings||[]).map(function(f){
        return '<p><strong>' + esc(f.aspect) + '.</strong></p>'
          + '<p class="muted">Differences. ' + (f.differences||[]).map(esc).join('; ') + '</p>'
          + '<p class="muted">Similarities. ' + (f.similarities||[]).map(esc).join('; ') + '</p>';
      }).join('');
      var contras = c.contradictions && c.contradictions.length
        ? '<p class="muted">Contradictions. ' + c.contradictions.map(esc).join('; ') + '</p>' : '';
      return '<li class="card"><p class="tag pale">' + esc(c.dimension) + '</p>' + findings + contras + '</li>';
    }).join('');

    return ''
      + '<header class="result-head">'
      +   '<h2>Results for &ldquo;' + esc(res.topic) + '&rdquo;</h2>'
      +   '<p class="muted">' + ((res.papers||[]).length) + ' papers, '
      +     ((res.gaps||[]).length) + ' gaps, '
      +     ((res.directions||[]).length) + ' directions.</p>'
      +   '<div class="actions">'
      +     '<a class="btn primary" href="/api/gap-report/' + taskId + '">Markdown report</a> '
      +     '<a class="btn ghost" href="/api/export/' + taskId + '/bibtex">BibTeX</a> '
      +     '<a class="btn ghost" href="/api/export/' + taskId + '/ris">RIS</a> '
      +     '<button class="btn ghost" type="button" onclick="downloadGapPdfs(\'' + esc(taskId) + '\')">Download these PDFs</button>'
      +   '</div>'
      + '</header>'
      + (gaps ? '<section><h3 class="section-head">Gaps</h3><ul class="cards">' + gaps + '</ul></section>' : '')
      + (cmps ? '<section><h3 class="section-head">Comparisons</h3><ul class="cards">' + cmps + '</ul></section>' : '')
      + (dirs ? '<section><h3 class="section-head">Directions</h3><ul class="cards">' + dirs + '</ul></section>' : '');
  }

  src.onmessage = function(e){
    try {
      var d = JSON.parse(e.data);
      prog.innerHTML = renderProgress(d);
      if (d.status === 'complete') { src.close(); loadResults(); }
      else if (d.status === 'error') { src.close(); renderError(d); }
    } catch(err) { console.error('gap progress parse error', err); }
  };
  src.onerror = function(){ src.close(); };
})();

window.downloadGapPdfs = function(taskId){
  fetch('/api/download-gap-papers/' + taskId, { method: 'POST', headers: { 'HX-Request': 'true' } })
    .then(function(r){ return r.text(); })
    .then(function(html){
      if (typeof switchMode === 'function') switchMode('finder');
      var out = document.getElementById('finder-output');
      if (out) out.innerHTML = html;
    });
};
</script>
{{end}}
